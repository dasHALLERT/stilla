name: Android APK bauen

# Baut eine installierbare Test-APK (Debug). Läuft bei Push auf die App
# und kann jederzeit von Hand gestartet werden (Actions -> "Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm install

      - name: App-Code einbetten (public -> www)
        run: |
          cp public/index.html public/manifest.json public/sw.js app/www/
          cp public/*.png app/www/
          echo "eingebettet:"; ls -la app/www

      - name: Android-Projekt erzeugen
        working-directory: app
        run: npx cap add android

      - name: Icons & Splash erzeugen
        working-directory: app
        run: npx @capacitor/assets@3 generate --android || echo "assets-Schritt übersprungen"

      - name: Web-Assets synchronisieren
        working-directory: app
        run: npx cap sync android

      - name: Versionsnummer hochzählen (für Store-Auto-Updates)
        working-directory: app
        run: |
          VC="${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode [0-9]\+/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${VC}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: System-Leisten einfärben (Status-/Navigationsleiste)
        working-directory: app
        run: python3 android-overrides/patch_theme.py

      - name: APK bauen (Debug)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK hochladen (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stilla-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK umbenennen
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk stilla.apk

      - name: Als Release veröffentlichen (fester Download-Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: stilla – neueste Test-APK
          body: |
            Neueste Android-Test-Version (Debug).
            Auf dem Handy die Datei **stilla.apk** antippen und installieren.
            Einmalig „Installation aus unbekannten Quellen" erlauben, wenn gefragt.
          files: stilla.apk
          make_latest: true
